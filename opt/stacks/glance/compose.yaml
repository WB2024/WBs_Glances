services:
  glance:
    image: glanceapp/glance:v0.8.6
    container_name: glance
    ports:
      - 3002:8080
    env_file:
      - /opt/glance/glance.env         # generated by tools/sync_env.py: only the variables the config uses (master secrets stay in /opt/glance/.env)
    volumes:
      - /opt/glance/config:/app/config
      - /opt/glance/assets:/app/assets
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /mnt/Main20TB:/mnt/Main20TB:ro  # so server-stats can show Main20TB usage
    environment:
      - TZ=Europe/London
    cpus: 1
    mem_limit: 512m
    restart: unless-stopped
