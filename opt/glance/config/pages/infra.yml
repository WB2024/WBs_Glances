                  {{ if gt (.JSON.Float "hosts.automation.temp_c") 0.0 }}<div><div class="size-h3 {{ if gt (.JSON.Float "hosts.automation.temp_c") 80.0 }}color-negative{{ else }}color-highlight{{ end }}">{{ printf "%.0f" (.JSON.Float "hosts.automation.temp_c") }}&deg;C</div><div class="size-h6">CPU TEMP</div></div>{{ end }}
                  <div><div class="size-h3 color-highlight">{{ printf "%.1f" (.JSON.Float "hosts.automation.uptime_d") }}d</div><div class="size-h6">UPTIME</div></div>
                </div>
                {{ range .JSON.Array "hosts.automation.disks" }}
                <div class="flex justify-between size-h6"><span class="color-subdue">{{ .String "name" }}</span><span>{{ .Int "used_gb" }} / {{ .Int "total_gb" }} GB &middot; {{ .Int "pct" }}%</span></div><div class="progress-bar margin-bottom-8"><div class="progress-value{{ if gt (.Int "pct") 85 }} progress-value-notice{{ end }}" style="--percent: {{ .Int "pct" }}"></div></div>
                {{ end }}
                <div class="size-h6 color-subdue margin-top-10">Docker {{ .JSON.String "hosts.automation.docker" }} &middot; <span class="color-positive">{{ .JSON.Int "hosts.automation.running" }} running</span> &middot; {{ .JSON.Int "hosts.automation.stopped" }} stopped &middot; {{ len (.JSON.Array "hosts.automation.stacks") }} stacks</div>
              </div>
              <div class="grow" style="flex-basis:24rem;min-width:0">
                <div class="wb-stacks" style="max-height:16rem;overflow-y:auto">
