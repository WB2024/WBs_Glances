        - type: custom-api
          title: Dockge · devuan
          title-url: http://${HOST_DEVUAN}:5001
          cache: 1m
          url: http://${HOST_SVC}:3005/api/infra/summary
          template: |

            {{ if .JSON.Bool "hosts.devuan.ok" }}
            <div class="flex gap-25" style="flex-wrap:wrap">
              <div style="flex:0 0 24rem;max-width:100%;min-width:0">
                <div class="wb-stats margin-bottom-10">
                  <div><div class="size-h3 {{ if gt (.JSON.Int "hosts.devuan.cpu_pct") 80 }}color-negative{{ else }}color-highlight{{ end }}">{{ .JSON.Int "hosts.devuan.cpu_pct" }}%</div><div class="size-h6">LOAD</div></div>
                  <div><div class="size-h3 {{ if gt (.JSON.Int "hosts.devuan.mem_pct") 90 }}color-negative{{ else }}color-highlight{{ end }}">{{ .JSON.Int "hosts.devuan.mem_pct" }}%</div><div class="size-h6">RAM &middot; {{ printf "%.1f" (div (.JSON.Float "hosts.devuan.mem_total_mb") 1024.0) }}G</div></div>
                  {{ if gt (.JSON.Float "hosts.devuan.temp_c") 0.0 }}<div><div class="size-h3 {{ if gt (.JSON.Float "hosts.devuan.temp_c") 80.0 }}color-negative{{ else }}color-highlight{{ end }}">{{ printf "%.0f" (.JSON.Float "hosts.devuan.temp_c") }}&deg;C</div><div class="size-h6">CPU TEMP</div></div>{{ end }}
                  <div><div class="size-h3 color-highlight">{{ printf "%.1f" (.JSON.Float "hosts.devuan.uptime_d") }}d</div><div class="size-h6">UPTIME</div></div>
                </div>
                {{ range .JSON.Array "hosts.devuan.disks" }}
