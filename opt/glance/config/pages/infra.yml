- name: Infra
  slug: infra
  width: wide
  columns:
    - size: full
      widgets:
        - type: split-column
          max-columns: 3
          widgets:
            - type: custom-api
              title: pve4
              title-url: https://${HOST_PVE4}:8006
              cache: 1m
              url: http://${HOST_SVC}:3005/api/infra/summary
              template: |

                {{ range .JSON.Array "nodes" }}{{ if eq (.String "name") "pve4" }}
                {{ if .Bool "ok" }}
                <div class="wb-stats margin-bottom-10">
                  <div><div class="size-h3 {{ if gt (.Int "cpu_pct") 80 }}color-negative{{ else }}color-highlight{{ end }}">{{ .Int "cpu_pct" }}%</div><div class="size-h6">CPU &middot; {{ .Int "cpus" }} cores</div></div>
                  <div><div class="size-h3 {{ if gt (.Int "mem_pct") 90 }}color-negative{{ else }}color-highlight{{ end }}">{{ .Int "mem_pct" }}%</div><div class="size-h6">RAM &middot; {{ printf "%.0f" (.Float "mem_total_gb") }}G</div></div>
                  <div><div class="size-h3 color-highlight">{{ .Float "load" }}</div><div class="size-h6">LOAD 1M</div></div>
                  <div><div class="size-h3 {{ if gt (.Int "rootfs_pct") 85 }}color-negative{{ else }}color-highlight{{ end }}">{{ .Int "rootfs_pct" }}%</div><div class="size-h6">ROOTFS</div></div>
                  <div><div class="size-h3 color-highlight">{{ printf "%.1f" (.Float "uptime_d") }}d</div><div class="size-h6">UPTIME</div></div>
                </div>
                <div class="size-h6 color-subdue margin-bottom-10">pve {{ .String "pve" }} &middot; kernel {{ .String "kernel" }}</div>

                <ul class="list list-gap-10 size-h6">
                {{ range .Array "guests" }}
                  <li>
                    <div class="flex justify-between gap-10">
                      <span class="text-truncate"><span class="color-subdue">{{ if eq (.String "kind") "lxc" }}CT{{ else }}VM{{ end }}{{ .Int "vmid" }}</span> {{ .String "name" }}</span>
                      <span class="shrink-0">{{ if eq (.String "status") "running" }}<span class="color-positive">&#9679;</span> {{ .Int "cpu_pct" }}% cpu{{ else }}<span class="color-subdue">&#9675; {{ .String "status" }}</span>{{ end }}</span>
                    </div>
                    <div class="flex justify-between size-h6"><span class="color-subdue">RAM</span><span>{{ .Int "mem_mb" }} / {{ .Int "maxmem_mb" }} MB</span></div><div class="progress-bar margin-bottom-4"><div class="progress-value{{ if gt (.Int "mem_pct") 85 }} progress-value-notice{{ end }}" style="--percent: {{ .Int "mem_pct" }}"></div></div>
                    <div class="flex justify-between size-h6"><span class="color-subdue">Disk</span><span>{{ printf "%.1f" (.Float "disk_gb") }} / {{ printf "%.0f" (.Float "maxdisk_gb") }} GB</span></div><div class="progress-bar margin-bottom-4"><div class="progress-value{{ if gt (.Int "disk_pct") 85 }} progress-value-notice{{ end }}" style="--percent: {{ .Int "disk_pct" }}"></div></div>
                  </li>
                {{ end }}
                </ul>

                <div class="size-h6 margin-top-10 {{ if gt (.Int "failed_7d") 0 }}color-negative{{ else }}color-positive{{ end }}">FAILED TASKS &middot; 7 DAYS: {{ .Int "failed_7d" }}</div>
                {{ range .Array "failed_latest" }}{{ if lt (.Int "age_h") 168 }}<div class="size-h6 color-subdue text-truncate">{{ .String "type" }} {{ .String "id" }} &middot; {{ .Int "age_h" }}h ago &middot; {{ .String "status" }}</div>{{ end }}{{ end }}
                <div class="size-h6 margin-top-5 {{ if .Bool "backed_up" }}color-subdue{{ else }}color-negative{{ end }}">{{ if .Bool "backed_up" }}host backup {{ .Int "backup_h" }}h ago{{ else }}no host backup in PBS{{ end }}</div>
                {{ else }}<p class="color-negative">Proxmox API unreachable: {{ .String "err" }}</p>{{ end }}
                {{ end }}{{ end }}


            - type: custom-api
              title: pve2
              title-url: https://${HOST_PVE2}:8006
              cache: 1m
              url: http://${HOST_SVC}:3005/api/infra/summary
              template: |

                {{ range .JSON.Array "nodes" }}{{ if eq (.String "name") "pve2" }}
                {{ if .Bool "ok" }}
                <div class="wb-stats margin-bottom-10">
                  <div><div class="size-h3 {{ if gt (.Int "cpu_pct") 80 }}color-negative{{ else }}color-highlight{{ end }}">{{ .Int "cpu_pct" }}%</div><div class="size-h6">CPU &middot; {{ .Int "cpus" }} cores</div></div>
                  <div><div class="size-h3 {{ if gt (.Int "mem_pct") 90 }}color-negative{{ else }}color-highlight{{ end }}">{{ .Int "mem_pct" }}%</div><div class="size-h6">RAM &middot; {{ printf "%.0f" (.Float "mem_total_gb") }}G</div></div>
                  <div><div class="size-h3 color-highlight">{{ .Float "load" }}</div><div class="size-h6">LOAD 1M</div></div>
                  <div><div class="size-h3 {{ if gt (.Int "rootfs_pct") 85 }}color-negative{{ else }}color-highlight{{ end }}">{{ .Int "rootfs_pct" }}%</div><div class="size-h6">ROOTFS</div></div>
                  <div><div class="size-h3 color-highlight">{{ printf "%.1f" (.Float "uptime_d") }}d</div><div class="size-h6">UPTIME</div></div>
                </div>
                <div class="size-h6 color-subdue margin-bottom-10">pve {{ .String "pve" }} &middot; kernel {{ .String "kernel" }}</div>

                <ul class="list list-gap-10 size-h6">
                {{ range .Array "guests" }}
                  <li>
                    <div class="flex justify-between gap-10">
                      <span class="text-truncate"><span class="color-subdue">{{ if eq (.String "kind") "lxc" }}CT{{ else }}VM{{ end }}{{ .Int "vmid" }}</span> {{ .String "name" }}</span>
                      <span class="shrink-0">{{ if eq (.String "status") "running" }}<span class="color-positive">&#9679;</span> {{ .Int "cpu_pct" }}% cpu{{ else }}<span class="color-subdue">&#9675; {{ .String "status" }}</span>{{ end }}</span>
                    </div>
                    <div class="flex justify-between size-h6"><span class="color-subdue">RAM</span><span>{{ .Int "mem_mb" }} / {{ .Int "maxmem_mb" }} MB</span></div><div class="progress-bar margin-bottom-4"><div class="progress-value{{ if gt (.Int "mem_pct") 85 }} progress-value-notice{{ end }}" style="--percent: {{ .Int "mem_pct" }}"></div></div>
                    <div class="flex justify-between size-h6"><span class="color-subdue">Disk</span><span>{{ printf "%.1f" (.Float "disk_gb") }} / {{ printf "%.0f" (.Float "maxdisk_gb") }} GB</span></div><div class="progress-bar margin-bottom-4"><div class="progress-value{{ if gt (.Int "disk_pct") 85 }} progress-value-notice{{ end }}" style="--percent: {{ .Int "disk_pct" }}"></div></div>
                  </li>
                {{ end }}
                </ul>

                <div class="size-h6 margin-top-10 {{ if gt (.Int "failed_7d") 0 }}color-negative{{ else }}color-positive{{ end }}">FAILED TASKS &middot; 7 DAYS: {{ .Int "failed_7d" }}</div>
                {{ range .Array "failed_latest" }}{{ if lt (.Int "age_h") 168 }}<div class="size-h6 color-subdue text-truncate">{{ .String "type" }} {{ .String "id" }} &middot; {{ .Int "age_h" }}h ago &middot; {{ .String "status" }}</div>{{ end }}{{ end }}
                <div class="size-h6 margin-top-5 {{ if .Bool "backed_up" }}color-subdue{{ else }}color-negative{{ end }}">{{ if .Bool "backed_up" }}host backup {{ .Int "backup_h" }}h ago{{ else }}no host backup in PBS{{ end }}</div>
                {{ else }}<p class="color-negative">Proxmox API unreachable: {{ .String "err" }}</p>{{ end }}
                {{ end }}{{ end }}


            - type: custom-api
              title: Proxmox Backup Server
              title-url: https://${HOST_PBS}:8007
              cache: 1m
              url: http://${HOST_SVC}:3005/api/infra/summary
              template: |

                {{ if .JSON.Bool "pbs.ok" }}
                <div class="wb-stats margin-bottom-10">
                  <div><div class="size-h3 color-highlight">{{ .JSON.Int "pbs.mem_pct" }}%</div><div class="size-h6">RAM</div></div>
                  <div><div class="size-h3 color-highlight">{{ .JSON.Float "pbs.load" }}</div><div class="size-h6">LOAD</div></div>
                  <div><div class="size-h3 color-highlight">{{ printf "%.0f" (.JSON.Float "pbs.uptime_d") }}d</div><div class="size-h6">UPTIME</div></div>
                </div>
                {{ range .JSON.Array "pbs.datastores" }}
                <div class="flex justify-between size-h6"><span class="color-subdue">{{ .String "store" }}</span><span>{{ .Int "used_gb" }} / {{ .Int "total_gb" }} GB &middot; {{ .Int "pct" }}%</span></div><div class="progress-bar margin-bottom-8"><div class="progress-value{{ if gt (.Int "pct") 85 }} progress-value-notice{{ end }}" style="--percent: {{ .Int "pct" }}"></div></div>
                {{ end }}
                <div class="size-h6 margin-top-10 {{ if gt (.JSON.Int "pbs.failed_7d") 0 }}color-negative{{ else }}color-positive{{ end }}">FAILED TASKS &middot; 7 DAYS: {{ .JSON.Int "pbs.failed_7d" }}</div>
                <div class="size-h6 color-subdue margin-top-10 margin-bottom-5">LAST BACKUP TASKS</div>
                <ul class="list list-gap-4 size-h6">
                {{ range .JSON.Array "pbs.recent" }}
                  <li class="flex justify-between gap-10"><span class="text-truncate">{{ .String "name" }}</span><span class="shrink-0 {{ if eq (.String "status") "OK" }}color-positive{{ else if eq (.String "status") "running" }}color-primary{{ else }}color-negative{{ end }}">{{ .String "status" }} &middot; {{ .Int "age_h" }}h</span></li>
                {{ end }}
                </ul>
                {{ else }}<p class="color-negative">PBS API unreachable: {{ .JSON.String "pbs.err" }}</p>{{ end }}


        - type: custom-api
          title: Dockge · services
          title-url: http://${HOST_SVC}:5001
          cache: 1m
          url: http://${HOST_SVC}:3005/api/infra/summary
          template: |

            {{ if .JSON.Bool "hosts.services.ok" }}
            <div class="flex gap-25" style="flex-wrap:wrap">
              <div style="flex:0 0 24rem;max-width:100%;min-width:0">
                <div class="wb-stats margin-bottom-10">
                  <div><div class="size-h3 {{ if gt (.JSON.Int "hosts.services.cpu_pct") 80 }}color-negative{{ else }}color-highlight{{ end }}">{{ .JSON.Int "hosts.services.cpu_pct" }}%</div><div class="size-h6">CPU</div></div>
                  <div><div class="size-h3 {{ if gt (.JSON.Int "hosts.services.mem_pct") 90 }}color-negative{{ else }}color-highlight{{ end }}">{{ .JSON.Int "hosts.services.mem_pct" }}%</div><div class="size-h6">RAM &middot; {{ printf "%.1f" (div (.JSON.Float "hosts.services.mem_total_mb") 1024.0) }}G</div></div>
                  {{ if gt (.JSON.Float "hosts.services.temp_c") 0.0 }}<div><div class="size-h3 {{ if gt (.JSON.Float "hosts.services.temp_c") 80.0 }}color-negative{{ else }}color-highlight{{ end }}">{{ printf "%.0f" (.JSON.Float "hosts.services.temp_c") }}&deg;C</div><div class="size-h6">CPU TEMP</div></div>{{ end }}
                  <div><div class="size-h3 color-highlight">{{ printf "%.1f" (.JSON.Float "hosts.services.uptime_d") }}d</div><div class="size-h6">UPTIME</div></div>
                </div>
                {{ range .JSON.Array "hosts.services.disks" }}
                <div class="flex justify-between size-h6"><span class="color-subdue">{{ .String "name" }}</span><span>{{ .Int "used_gb" }} / {{ .Int "total_gb" }} GB &middot; {{ .Int "pct" }}%</span></div><div class="progress-bar margin-bottom-8"><div class="progress-value{{ if gt (.Int "pct") 85 }} progress-value-notice{{ end }}" style="--percent: {{ .Int "pct" }}"></div></div>
                {{ end }}
                <div class="size-h6 color-subdue margin-top-10">Docker {{ .JSON.String "hosts.services.docker" }} &middot; <span class="color-positive">{{ .JSON.Int "hosts.services.running" }} running</span> &middot; {{ .JSON.Int "hosts.services.stopped" }} stopped &middot; {{ len (.JSON.Array "hosts.services.stacks") }} stacks</div>
              </div>
              <div class="grow" style="flex-basis:24rem;min-width:0">
                <div class="wb-stacks" style="max-height:26rem;overflow-y:auto">
                {{ range .JSON.Array "hosts.services.stacks" }}{{ if not (.Bool "private") }}
                  <div class="wb-stack">
                    <div class="wb-stack-name">{{ .String "name" }}</div>
                    <ul class="list list-gap-4 size-h6">
                    {{ range .Array "containers" }}
                      <li class="text-truncate" title="{{ .String "image" }} &middot; {{ .String "status" }}"><span class="{{ if eq (.String "state") "running" }}{{ if eq (.String "health") "unhealthy" }}color-negative{{ else }}color-positive{{ end }}{{ else }}color-subdue{{ end }}">{{ if eq (.String "state") "running" }}&#9679;{{ else }}&#9675;{{ end }}</span> {{ .String "name" }}</li>
                    {{ end }}
                    </ul>
                  </div>{{ end }}
                {{ end }}
                </div>
              </div>
            </div>
            {{ else }}<p class="color-negative">Host unreachable: {{ .JSON.String "hosts.services.err" }}</p>{{ end }}

        - type: custom-api
          title: Dockge · jellyfin
