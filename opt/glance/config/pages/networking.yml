- name: Networking
  slug: networking
  width: wide
  columns:
    - size: full
      widgets:
        - type: html
          title: Network topology
          title-url: http://bookstack.wbhomelab/books/networking
          source: |
            <svg class="wb-topo" viewBox="0 0 1100 430" xmlns="http://www.w3.org/2000/svg">
              <text class="t-sub" x="1090" y="14" text-anchor="end">as running · Sep 2026 · full detail in BookStack › Networking</text>
              <!-- links -->
              <path class="link" d="M120 45 H170"/>
              <path class="link" d="M340 45 H490 V125"/>
              <path class="link" d="M180 165 H370"/>
              <path class="link" d="M180 215 H370"/>
              <path class="link" d="M400 235 V300"/>
              <path class="link link-acl" d="M540 235 V300"/>
              <path class="link" d="M600 235 V270 H675 V300"/>
              <path class="link link-fibre" d="M610 165 H750"/>
              <path class="link link-standby" d="M610 215 H750"/>
              <path class="link" d="M805 235 V300"/>
              <path class="link" d="M925 235 V300"/>
              <path class="link link-vlan15" d="M1040 235 V300"/>

              <!-- WAN / gateway -->
              <rect class="box" x="15" y="25" width="105" height="40"/>
              <text class="t-title" x="67" y="49" text-anchor="middle">Internet</text>
              <rect class="box" x="170" y="20" width="170" height="50"/>
              <text class="t-title" x="255" y="40" text-anchor="middle">EE Smart Hub · .254</text>
              <text class="t-sub" x="255" y="56" text-anchor="middle">gateway · DHCP · WiFi</text>
              <text class="t-tag" x="480" y="115" text-anchor="end">p1 · untagged 12</text>

              <!-- core -->
              <rect class="box box-core" x="370" y="125" width="240" height="110"/>
              <text class="t-title" x="490" y="148" text-anchor="middle">D-Link DGS-1520-52 · .3</text>
              <text class="t-sub" x="490" y="164" text-anchor="middle">core · dining room</text>
              <text class="t-sub" x="490" y="182" text-anchor="middle">Super VLAN 10 · sub 12 · 15</text>
              <text class="t-sub" x="490" y="198" text-anchor="middle">Local Proxy ARP · RSTP · ACLs</text>
              <text class="t-tag" x="490" y="222" text-anchor="middle">all on VLAN 12 unless marked</text>

              <!-- left: DNS -->
              <rect class="box" x="30" y="145" width="150" height="40"/>
              <text class="t-title" x="105" y="162" text-anchor="middle">Pi-hole 1 · .53</text>
              <text class="t-sub" x="105" y="177" text-anchor="middle">Pi B+ · Unbound · NTP</text>
              <text class="t-tag" x="360" y="160" text-anchor="end">p2</text>
              <rect class="box" x="30" y="195" width="150" height="40"/>
              <text class="t-title" x="105" y="212" text-anchor="middle">Pi-hole 2 · .54</text>
              <text class="t-sub" x="105" y="227" text-anchor="middle">Pi 2 · Unbound · sync 05:00</text>
              <text class="t-tag" x="360" y="210" text-anchor="end">p12</text>

              <!-- below core -->
              <rect class="box" x="330" y="300" width="140" height="80"/>
              <text class="t-title" x="400" y="318" text-anchor="middle">Living room</text>
              <text class="t-sub" x="400" y="334" text-anchor="middle">Ugreen switch</text>
              <text class="t-sub" x="400" y="349" text-anchor="middle">HTPC .43 · Xbox .187</text>
              <text class="t-sub" x="400" y="364" text-anchor="middle">TV .202</text>
              <text class="t-tag" x="406" y="292">p9</text>

              <rect class="box" x="480" y="300" width="120" height="80"/>
              <text class="t-title" x="540" y="318" text-anchor="middle">EZVIZ cam</text>
              <text class="t-sub" x="540" y="334" text-anchor="middle">.156 · PoE</text>
              <text class="t-sub" x="540" y="349" text-anchor="middle">ACL CCTV-ISOLATE</text>
              <text class="t-sub" x="540" y="364" text-anchor="middle">→ Frigate only</text>
              <text class="t-tag" x="546" y="292">p10</text>

              <rect class="box" x="610" y="300" width="130" height="80"/>
              <text class="t-title" x="675" y="318" text-anchor="middle">GL.iNet · .52</text>
              <text class="t-sub" x="675" y="334" text-anchor="middle">upstairs AP</text>
              <text class="t-sub" x="675" y="349" text-anchor="middle">bedroom · dressing</text>
              <text class="t-sub" x="675" y="364" text-anchor="middle">room switches</text>
              <text class="t-tag" x="681" y="292">p11</text>

              <!-- office -->
              <rect class="box" x="750" y="125" width="340" height="110"/>
              <text class="t-title" x="920" y="148" text-anchor="middle">HP 1810-24G · .10</text>
              <text class="t-sub" x="920" y="164" text-anchor="middle">office · J9803A · RSTP</text>
              <text class="t-sub" x="920" y="182" text-anchor="middle">p2–12 trusted · VLAN 12</text>
              <text class="t-sub" x="920" y="198" text-anchor="middle">p13–24 untrusted · VLAN 15</text>
              <text class="t-sub" x="920" y="216" text-anchor="middle">p4 devuan .106 · p5 laptop</text>
              <text class="t-tag" x="680" y="158" text-anchor="middle">p51 ⇄ p26 fibre · root</text>
              <text class="t-tag" x="680" y="230" text-anchor="middle">p5 ⇄ p1 copper · standby</text>

              <rect class="box" x="750" y="300" width="110" height="80"/>
              <text class="t-title" x="805" y="318" text-anchor="middle">pve4 · .60</text>
              <text class="t-sub" x="805" y="334" text-anchor="middle">main node</text>
              <text class="t-sub" x="805" y="349" text-anchor="middle">CT103 services</text>
              <text class="t-sub" x="805" y="364" text-anchor="middle">CT104 jellyfin</text>
              <text class="t-tag" x="811" y="292">p6</text>

              <rect class="box" x="870" y="300" width="110" height="80"/>
              <text class="t-title" x="925" y="318" text-anchor="middle">pve2 · PBS</text>
              <text class="t-sub" x="925" y="334" text-anchor="middle">.59 automation</text>
              <text class="t-sub" x="925" y="349" text-anchor="middle">CT200 HA·Frigate</text>
              <text class="t-sub" x="925" y="364" text-anchor="middle">.250 backups</text>
              <text class="t-tag" x="931" y="292">p3 · p2</text>

              <rect class="box" x="990" y="300" width="100" height="80"/>
              <text class="t-title" x="1040" y="318" text-anchor="middle">FiiO R7</text>
              <text class="t-sub" x="1040" y="334" text-anchor="middle">.89 static</text>
              <text class="t-tag" x="1040" y="349" text-anchor="middle">sub-VLAN 15</text>
              <text class="t-sub" x="1040" y="364" text-anchor="middle">p13 untrusted</text>

              <!-- legend -->
              <path class="link link-fibre" d="M20 412 H50"/><text class="t-sub" x="56" y="416">fibre · active</text>
              <path class="link link-standby" d="M150 412 H180"/><text class="t-sub" x="186" y="416">copper · RSTP standby</text>
              <path class="link link-acl" d="M330 412 H360"/><text class="t-sub" x="366" y="416">port ACL</text>
              <path class="link link-vlan15" d="M440 412 H470"/><text class="t-sub" x="476" y="416">sub-VLAN 15</text>
            </svg>

        - type: split-column
          max-columns: 2
          widgets:
            - type: dns-stats
              title: Pi-hole 1 (.53)
              title-url: http://${HOST_PIHOLE1}/admin
              service: pihole-v6
              url: http://${HOST_PIHOLE1}
              password: ${PIHOLE_KEY}
              hour-format: 24h

            - type: dns-stats
              title: Pi-hole 2 (.54)
              title-url: http://${HOST_PIHOLE2}/admin
              service: pihole-v6
              url: http://${HOST_PIHOLE2}
              password: ${PIHOLE_KEY}
              hour-format: 24h

        - type: custom-api
          title: Tailscale mesh
          title-url: https://login.tailscale.com/admin/machines
          cache: 2m
          url: http://${HOST_SVC}:3005/api/tailscale/summary
          template: |
            <div class="wb-stats margin-bottom-15">
              <div><div class="size-h3 color-positive">{{ .JSON.Int "online" }}</div><div class="size-h6">ONLINE</div></div>
              <div><div class="size-h3 color-highlight">{{ .JSON.Int "offline" }}</div><div class="size-h6">OFFLINE</div></div>
              <div><div class="size-h3 {{ if gt (.JSON.Int "expired") 0 }}color-negative{{ else }}color-highlight{{ end }}">{{ .JSON.Int "expired" }}</div><div class="size-h6">KEYS EXPIRED</div></div>
              <div><div class="size-h3 color-highlight">{{ .JSON.Int "updates" }}</div><div class="size-h6">UPDATES</div></div>
            </div>
            <div class="wb-tiles">
            {{ range .JSON.Array "devices" }}
              <div class="wb-tile{{ if not (.Bool "online") }} wb-tile-off{{ end }}">
                <span class="{{ if .Bool "online" }}color-positive{{ else }}color-subdue{{ end }}">&#9679;</span>
                <div class="wb-tile-main">
                  <div class="color-highlight text-truncate">{{ .String "name" }} <span class="color-subdue size-h6">{{ .String "os" }}</span></div>
                  <div class="size-h6 color-subdue text-truncate">{{ .String "ip" }} &middot; {{ if .Bool "online" }}online{{ else if gt (.Int "seen_h") 48 }}seen {{ div (.Int "seen_h") 24 }}d ago{{ else }}seen {{ .Int "seen_h" }}h ago{{ end }}{{ if ne (.String "tags") "" }} &middot; {{ .String "tags" }}{{ end }}</div>
                </div>
                <div class="wb-tile-flags size-h6">
                  {{ if .Bool "key_expired" }}<span class="color-negative">key expired</span>{{ else if .Bool "expires_soon" }}<span class="color-primary">key {{ .Int "expires_days" }}d</span>{{ end }}
                  {{ if .Bool "update" }}<span class="color-subdue">update</span>{{ end }}
                </div>
              </div>
            {{ end }}
            </div>

        - type: html
          title: VPN
          title-url: http://${HOST_SVC}:3010
          source: |
            <div data-wb="vpn" data-wb-noindex></div>

        - type: custom-api
          title: Nginx Proxy Manager
          title-url: http://${HOST_SVC}:81
          cache: 1m
          url: http://${HOST_SVC}:3005/api/npm/summary
          template: |
            <div class="wb-stats margin-bottom-15">
              <div><div class="size-h3 color-highlight">{{ .JSON.Int "total" }}</div><div class="size-h6">PROXY HOSTS</div></div>
              <div><div class="size-h3 {{ if gt (.JSON.Int "down") 0 }}color-negative{{ else }}color-positive{{ end }}">{{ .JSON.Int "down" }}</div><div class="size-h6">BACKEND DOWN</div></div>
              <div><div class="size-h3 {{ if gt (.JSON.Int "disabled") 0 }}color-primary{{ else }}color-highlight{{ end }}">{{ .JSON.Int "disabled" }}</div><div class="size-h6">DISABLED</div></div>
              <div><div class="size-h3 color-highlight">{{ .JSON.Int "redirections" }} / {{ .JSON.Int "streams" }}</div><div class="size-h6">REDIRECTS / STREAMS</div></div>
            </div>
            {{ range .JSON.Array "hosts" }}{{ if or (not (.Bool "backend_up")) (not (.Bool "enabled")) }}
            <div class="flex justify-between gap-10 size-h6 margin-bottom-5"><span class="text-truncate"><span class="color-negative">&#9679;</span> {{ .String "domain" }} <span class="color-subdue">&rarr; {{ .String "target" }}</span></span><span class="shrink-0 {{ if .Bool "enabled" }}color-negative{{ else }}color-primary{{ end }}">{{ if not (.Bool "backend_up") }}backend down{{ else }}disabled{{ end }}</span></div>
            {{ end }}{{ end }}
            <details class="wb-fold">
              <summary>All proxy hosts ({{ .JSON.Int "total" }})</summary>
              <ul class="list list-gap-4 size-h6 margin-top-10">
              {{ range .JSON.Array "hosts" }}
                <li class="flex justify-between gap-10">
                  <span class="text-truncate"><span class="{{ if .Bool "backend_up" }}color-positive{{ else }}color-negative{{ end }}">&#9679;</span> <a class="color-highlight" href="http://{{ .String "domain" }}" target="_blank">{{ .String "domain" }}</a>{{ if gt (.Int "extra") 0 }} <span class="color-subdue">+{{ .Int "extra" }}</span>{{ end }} <span class="color-subdue">&rarr; {{ .String "target" }}</span></span>
                  <span class="shrink-0">{{ if not (.Bool "enabled") }}<span class="color-primary">disabled</span> {{ end }}{{ if .Bool "ssl" }}<span class="color-positive">ssl</span>{{ end }}</span>
                </li>
              {{ end }}
              </ul>
            </details>
            {{ if .JSON.Array "certs" }}
            <div class="size-h6 color-subdue margin-top-15 margin-bottom-5">CERTIFICATES</div>
            <ul class="list list-gap-4 size-h6">
            {{ range .JSON.Array "certs" }}
              <li class="flex justify-between gap-10"><span class="text-truncate">{{ .String "name" }} <span class="color-subdue">&middot; {{ .String "provider" }} &middot; {{ if eq (.Int "used_by") 0 }}not used by any host{{ else }}used by {{ .Int "used_by" }}{{ end }}</span></span><span class="shrink-0 {{ if lt (.Int "days") 30 }}color-negative{{ else }}color-positive{{ end }}">{{ .Int "days" }} days left</span></li>
            {{ end }}
            </ul>
            {{ end }}

    - size: small
      widgets:
        - type: monitor
          title: Routers & switches
          cache: 1m
          sites:
            - { title: "EE Smart Hub · .254 (gateway)",   url: "http://${HOST_ROUTER}",    icon: mdi:router-wireless }
            - { title: "D-Link DGS-1520-52 · .3 (core)",   url: "http://${HOST_CORE}",      icon: mdi:lan,          timeout: 8s }
            - { title: "HP 1810-24G · .10 (office)",       url: "http://${HOST_OFFICE_SW}", icon: mdi:switch,       timeout: 8s }
            - { title: "GL.iNet SFT1200 · .52 (AP)",       url: "http://${HOST_AP}",        icon: mdi:access-point }
