- name: Home
  slug: home
  width: wide
  columns:
    - size: small
      widgets:
        - type: clock
          hour-format: 24h
          timezones:
            - { timezone: Europe/London, label: London }
            - { timezone: America/New_York, label: New York }
            - { timezone: Asia/Tokyo, label: Tokyo }

        - type: weather
          location: London, United Kingdom
          units: metric
          hour-format: 24h

        - type: calendar
          first-day-of-week: monday

    - size: full
      widgets:
        - type: html
          title: Find
          source: |
            <div class="widget-header"><h2 class="uppercase">Find</h2></div>
            <div data-wb="find" data-wb-noindex></div>

        - type: html
          title: Search
          source: |
            <div class="widget-header"><h2 class="uppercase">Search</h2></div>
            <div data-wb="search" data-wb-noindex data-engines='[["SearXNG","http://searxng.wbhomelab/search?q={QUERY}","si:searxng"],["Startpage","https://www.startpage.com/sp/search?query={QUERY}","si:startpage"],["YouTube","https://www.youtube.com/results?search_query={QUERY}","si:youtube"],["Reddit","https://www.reddit.com/search/?q={QUERY}","si:reddit"],["Redlib","https://redlib.catsarch.com/search?q={QUERY}","si:reddit"],["MusicBrainz","https://musicbrainz.org/search?query={QUERY}&type=release&method=indexed","si:musicbrainz"],["Discogs","https://www.discogs.com/search/?q={QUERY}&type=all","si:discogs"],["GitHub","https://github.com/search?q={QUERY}","si:github"],["Wikipedia","https://en.wikipedia.org/w/index.php?search={QUERY}","si:wikipedia"],["Hacker News","https://hn.algolia.com/?q={QUERY}","si:ycombinator"],["Amazon UK","https://www.amazon.co.uk/s?k={QUERY}","si:amazon"],["eBay UK","https://www.ebay.co.uk/sch/i.html?_nkw={QUERY}","si:ebay"],["Jellyfin","http://${HOST_JELLY}:8096/web/#/search.html?query={QUERY}","si:jellyfin"],["Lidarr","http://${HOST_SVC}:8686/add/search?term={QUERY}","mdi:album"],["Seerr","http://${HOST_SVC}:5055/search?query={QUERY}","mdi:movie-search"],["BookStack","http://bookstack.wbhomelab/search?term={QUERY}","si:bookstack"]]'></div>

        - type: custom-api
          title: Now playing
          title-url: http://${HOST_JELLY}:8096
          cache: 30s
          url: http://${HOST_JELLY}:8096/Sessions?activeWithinSeconds=600
          headers:
            X-Emby-Token: ${JELLYFIN_KEY}
            Accept: application/json
          subrequests:
            nd:
              url: http://${HOST_SVC}:4534/rest/getNowPlaying.view?u=${NAVIDROME_USER}&t=${NAVIDROME_TOKEN}&s=${NAVIDROME_SALT}&v=1.16.1&c=glance&f=json
          template: |
            {{ $n := 0 }}
            <ul class="list list-gap-8">
            {{ range .JSON.Array "" }}{{ if .Exists "NowPlayingItem" }}{{ $n = add $n 1 }}
              <li class="flex items-center gap-10">
                {{ $img := .String "NowPlayingItem.Id" }}{{ if .Exists "NowPlayingItem.SeriesId" }}{{ $img = .String "NowPlayingItem.SeriesId" }}{{ end }}
                <img src="http://${HOST_JELLY}:8096/Items/{{ $img }}/Images/Primary?maxHeight=120" alt="" style="width:2.6rem;aspect-ratio:2/3;object-fit:cover;border-radius:4px" class="shrink-0">
                <div class="min-width-0 grow">
                  <div class="text-truncate color-highlight">{{ if .Exists "NowPlayingItem.SeriesName" }}{{ .String "NowPlayingItem.SeriesName" }} · {{ end }}{{ .String "NowPlayingItem.Name" }}</div>
                  <div class="size-h6 color-subdue text-truncate">Jellyfin · {{ .String "UserName" }} · {{ .String "Client" }}{{ if .Bool "PlayState.IsPaused" }} · paused{{ end }}</div>
                  {{ if .Exists "NowPlayingItem.RunTimeTicks" }}{{ $pct := mul (div (toFloat (.Int "PlayState.PositionTicks")) (toFloat (.Int "NowPlayingItem.RunTimeTicks"))) 100 }}<div class="wb-progress"><div style="width:{{ printf "%.0f" $pct }}%"></div></div>{{ end }}
                </div>
              </li>
            {{ end }}{{ end }}
            {{ range (.Subrequest "nd").JSON.Array "subsonic-response.nowPlaying.entry" }}{{ $n = add $n 1 }}
              <li class="flex items-center gap-10">
                <div class="shrink-0 color-positive">♪</div>
                <div class="min-width-0">
                  <div class="text-truncate color-highlight">{{ .String "title" }}</div>
                  <div class="size-h6 color-subdue text-truncate">Navidrome · {{ .String "artist" }} — {{ .String "album" }} · {{ .String "username" }}</div>
                </div>
              </li>
            {{ end }}
            </ul>
            {{ if eq $n 0 }}<p class="color-subdue size-h6">Nothing playing on Jellyfin or Navidrome</p>{{ end }}


    - size: small
      widgets:
        - type: html
          title: Notes
          source: |
            <div class="widget-header"><h2 class="uppercase">Notes</h2></div>
            <div data-wb="notes" data-wb-noindex></div>

        - type: html
          title: To-do
          source: |
            <div class="widget-header"><h2 class="uppercase">To-do</h2></div>
            <div data-wb="todo" data-wb-noindex></div>
