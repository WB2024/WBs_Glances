        - type: custom-api
          title: Storage and backups
          title-url: https://${HOST_PBS}:8007
          cache: 1m
          url: http://${HOST_SVC}:3005/api/infra/summary
          template: |

            <div class="flex gap-25" style="flex-wrap:wrap">
              <div style="flex:1 1 22rem;min-width:0">
                <div class="size-h6 color-subdue margin-bottom-5">SPACE IN USE</div>
                {{ range .JSON.Array "nodes" }}{{ if eq (.String "name") "pve4" }}{{ range .Array "storage" }}<div class="flex justify-between size-h6"><span class="color-subdue">pve4 &middot; {{ .String "name" }}</span><span>{{ .Int "used_gb" }} / {{ .Int "total_gb" }} GB &middot; {{ .Int "pct" }}%</span></div><div class="progress-bar margin-bottom-8"><div class="progress-value{{ if gt (.Int "pct") 85 }} progress-value-notice{{ end }}" style="--percent: {{ .Int "pct" }}"></div></div>{{ end }}{{ end }}{{ end }}
                {{ range .JSON.Array "hosts.devuan.disks" }}<div class="flex justify-between size-h6"><span class="color-subdue">devuan &middot; {{ .String "name" }}</span><span>{{ .Int "used_gb" }} / {{ .Int "total_gb" }} GB &middot; {{ .Int "pct" }}%</span></div><div class="progress-bar margin-bottom-8"><div class="progress-value{{ if gt (.Int "pct") 85 }} progress-value-notice{{ end }}" style="--percent: {{ .Int "pct" }}"></div></div>{{ end }}
                {{ range .JSON.Array "hosts.services.disks" }}<div class="flex justify-between size-h6"><span class="color-subdue">services &middot; {{ .String "name" }}</span><span>{{ .Int "used_gb" }} / {{ .Int "total_gb" }} GB &middot; {{ .Int "pct" }}%</span></div><div class="progress-bar margin-bottom-8"><div class="progress-value{{ if gt (.Int "pct") 85 }} progress-value-notice{{ end }}" style="--percent: {{ .Int "pct" }}"></div></div>{{ end }}
                {{ range .JSON.Array "pbs.datastores" }}<div class="flex justify-between size-h6"><span class="color-subdue">PBS &middot; {{ .String "store" }}</span><span>{{ .Int "used_gb" }} / {{ .Int "total_gb" }} GB &middot; {{ .Int "pct" }}%</span></div><div class="progress-bar margin-bottom-8"><div class="progress-value{{ if gt (.Int "pct") 85 }} progress-value-notice{{ end }}" style="--percent: {{ .Int "pct" }}"></div></div>{{ end }}
              </div>
              <div style="flex:2 1 34rem;min-width:0">
                <div class="size-h6 color-subdue margin-bottom-5">EVERY PHYSICAL DISK</div>
                <ul class="list list-gap-8 size-h6">
                {{ range .JSON.Array "nodes" }}{{ $node := .String "name" }}
                  {{ range .Array "disks" }}
                  <li>
                    <div class="flex justify-between gap-10">
                      <span class="text-truncate"><span class="color-subdue">{{ $node }}</span> <span class="color-highlight">{{ .String "dev" }}</span> {{ .String "model" }}</span>
                      <span class="shrink-0">{{ if ge (.Int "size_gb") 1000 }}{{ printf "%.1f" (div (.Float "size_gb") 1000.0) }} TB{{ else }}{{ .Int "size_gb" }} GB{{ end }} &middot; <span class="{{ if eq (.String "health") "PASSED" }}color-positive{{ else if eq (.String "health") "UNKNOWN" }}color-subdue{{ else }}color-negative{{ end }}">{{ .String "health" }}</span>{{ if gt (.Int "pct") 0 }} &middot; {{ .Int "pct" }}% used{{ end }}{{ if .Exists "wear_left" }}{{ if gt (.Int "wear_left") 0 }} &middot; {{ .Int "wear_left" }}% life{{ end }}{{ end }}</span>
                    </div>
                    <div class="color-subdue text-truncate">{{ .String "mount" }}{{ if .String "role" }} &middot; {{ .String "role" }}{{ end }}</div>
                  </li>
                  {{ end }}
                {{ end }}
                {{ range .JSON.Array "hosts.devuan.disks" }}
                  <li>
                    <div class="flex justify-between gap-10"><span class="text-truncate"><span class="color-subdue">devuan</span> <span class="color-highlight">{{ .String "name" }}</span></span><span class="shrink-0">{{ if ge (.Int "total_gb") 1000 }}{{ printf "%.1f" (div (.Float "total_gb") 1000.0) }} TB{{ else }}{{ .Int "total_gb" }} GB{{ end }} &middot; {{ .Int "pct" }}% used</span></div>
                    <div class="color-subdue text-truncate">{{ .String "mount" }} &middot; {{ .String "role" }}</div>
                  </li>
                {{ end }}
                </ul>
              </div>
              <div style="flex:1 1 22rem;min-width:0">
                <div class="size-h6 color-subdue margin-bottom-5">BACKUP COVERAGE (PBS)</div>
                <ul class="list list-gap-4 size-h6">
                {{ range .JSON.Array "nodes" }}
                  <li class="flex justify-between gap-10"><span>host &middot; {{ .String "name" }}</span><span class="{{ if .Bool "backed_up" }}color-positive{{ else }}color-negative{{ end }}">{{ if .Bool "backed_up" }}{{ .Int "backup_h" }}h ago{{ else }}NO BACKUP{{ end }}</span></li>
                  {{ range .Array "guests" }}
                  <li class="flex justify-between gap-10"><span>{{ if eq (.String "kind") "lxc" }}CT{{ else }}VM{{ end }}{{ .Int "vmid" }} &middot; {{ .String "name" }}</span><span class="{{ if .Bool "backed_up" }}color-positive{{ else }}color-negative{{ end }}">{{ if .Bool "backed_up" }}{{ .Int "backup_h" }}h ago{{ else }}NO BACKUP{{ end }}</span></li>
                  {{ end }}
                {{ end }}
                {{ range .JSON.Array "pbs.groups" }}{{ if .Bool "stale" }}
                  <li class="flex justify-between gap-10 color-subdue"><span>PBS group {{ .String "type" }}/{{ .String "id" }}</span><span class="color-negative">last {{ div (.Int "age_h") 24 }}d ago (stale)</span></li>
                {{ end }}{{ end }}
                </ul>
              </div>
            </div>

