                {{ end }}
                <div class="size-h6 color-subdue margin-top-10">Docker {{ .JSON.String "hosts.devuan.docker" }} &middot; <span class="color-positive">{{ .JSON.Int "hosts.devuan.running" }} running</span> &middot; {{ .JSON.Int "hosts.devuan.stopped" }} stopped &middot; {{ len (.JSON.Array "hosts.devuan.stacks") }} stacks</div>
              </div>

            </div>
            {{ else }}<p class="color-negative">Host unreachable: {{ .JSON.String "hosts.devuan.err" }}</p>{{ end }}

        - type: custom-api
          title: Dockge · devuan (containers)
          title-url: http://${HOST_DEVUAN}:5001
          css-class: wb-restricted
          cache: 1m
          url: http://${HOST_SVC}:3005/api/infra/summary
          template: |
            {{ if .JSON.Bool "hosts.devuan.ok" }}<div>  <div class="grow" style="flex-basis:24rem;min-width:0">
                <div class="wb-stacks" style="max-height:18rem;overflow-y:auto">
                {{ range .JSON.Array "hosts.devuan.stacks" }}
                  <div class="wb-stack">
                    <div class="wb-stack-name">{{ .String "name" }}</div>
                    <ul class="list list-gap-4 size-h6">
                    {{ range .Array "containers" }}
                      <li class="text-truncate" title="{{ .String "image" }} &middot; {{ .String "status" }}"><span class="{{ if eq (.String "state") "running" }}{{ if eq (.String "health") "unhealthy" }}color-negative{{ else }}color-positive{{ end }}{{ else }}color-subdue{{ end }}">{{ if eq (.String "state") "running" }}&#9679;{{ else }}&#9675;{{ end }}</span> {{ .String "name" }}</li>
                    {{ end }}
                    </ul>
                  </div>
                {{ end }}
                </div>
              </div></div>{{ else }}<p class="color-negative">Host unreachable</p>{{ end }}
        - type: html
          title: Infrastructure map
          source: |
            <svg class="wb-topo" viewBox="0 0 1100 640" xmlns="http://www.w3.org/2000/svg">
